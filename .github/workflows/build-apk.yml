name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install deps
        run: npm install
      - name: Copy vendor libs
        run: node scripts/copy-vendor.mjs
      - name: Add Android platform
        run: npx cap add android
      - name: Generate icons
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'
      - name: Harden Android manifest (no backup)
        run: sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OceanFood.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OceanFood-APK
          path: OceanFood.apk
      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: apk-latest
          name: أحدث نسخة APK
          body: "آخر نسخة من التطبيق. حمّل OceanFood.apk وثبّته على الموبايل."
          files: OceanFood.apk
          make_latest: true
